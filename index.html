<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Функциональная матрица</title>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="compact-header">
    <div class="header-left">
      <img src="assets/header-image.png" alt="Logo" class="header-image" />
      <div class="title-compact">
        <h1>Функциональная матрица</h1>
        <p class="subtitle-compact">Интерактивный просмотр ролей</p>
      </div>
    </div>

    <div class="header-right">
      <div class="controls-compact">
        <!-- custom multiselect controls (JS replaces content) -->
        <div class="filter-compact">
          <label>Функция</label>
          <div class="multiselect" id="filter-function" data-filter="function" data-placeholder="Все"></div>
        </div>

        <div class="filter-compact">
          <label>Департамент</label>
          <div class="multiselect" id="filter-department" data-filter="department" data-placeholder="Все"></div>
        </div>

        <div class="filter-compact">
          <label>Отдел</label>
          <div class="multiselect" id="filter-division" data-filter="division" data-placeholder="Все"></div>
        </div>

        <div class="filter-compact">
          <label>Должность</label>
          <div class="multiselect" id="filter-position" data-filter="position" data-placeholder="Все"></div>
        </div>

        <div class="filter-compact">
          <label>Роль</label>
          <div class="multiselect" id="filter-role" data-filter="role" data-placeholder="Все"></div>
        </div>
      </div>

      <div class="actions-compact">
        <button id="clear" class="btn-light">Сбросить</button>
        <button id="export" class="btn-primary">Экспорт</button>
      </div>
    </div>
  </header>

  <main class="main-area">
    <div id="info" class="info hidden"></div>

    <div class="table-wrapper" id="table-wrapper">
      <table id="matrix" aria-describedby="info">
        <!-- colgroup статичен: 7 колонок -->
        <colgroup>
          <col class="c1" />
          <col class="c2" />
          <col class="c3" />
          <col class="c4" />
          <col class="c5" />
          <col class="c6" />
          <col class="c7" />
        </colgroup>

        <thead>
          <tr>
            <th class="col-id">№</th>
            <th class="col-function">Функция</th>
            <th class="col-text-medium">Продукт</th>
            <th class="col-department">Департамент</th>
            <th class="col-division">Отдел</th>
            <th class="col-position">Должность</th>
            <th class="col-role">Роль</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <!-- toast -->
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
