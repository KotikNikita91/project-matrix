<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Функциональная матрица</title>

  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.5.31/dist/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Модальное окно настроек -->
  <div id="settings-modal" class="modal">
    <div class="modal-content">
      <h2>Настройки Google Sheets</h2>
      <p class="modal-desc">Укажите ID вашей таблицы Google Sheets</p>
      <div class="form-group">
        <label for="sheet-id">ID таблицы Google Sheets:</label>
        <input type="text" id="sheet-id" placeholder="1ABC...xyz" />
        <small>Найдите ID в URL: https://docs.google.com/spreadsheets/d/<strong>ID_ТАБЛИЦЫ</strong>/edit</small>
      </div>
      <div class="form-group">
        <label for="matrix-range">Лист "Матрица" (название):</label>
        <input type="text" id="matrix-range" value="Матрица" />
      </div>
      <div class="form-group">
        <label for="legend-range">Лист "Легенда" (название):</label>
        <input type="text" id="legend-range" value="Легенда с уровнями" />
      </div>
      <div class="form-actions">
        <button id="save-settings" class="btn-primary">Сохранить и загрузить</button>
        <button id="cancel-settings" class="btn-light">Отмена</button>
      </div>
      <div class="modal-note">
        <strong>Важно:</strong> Таблица должна быть доступна по ссылке
      </div>
    </div>
  </div>

  <!-- Модальное окно легенды -->
  <div id="legend-modal" class="modal">
    <div class="modal-content modal-legend">
      <div class="modal-header">
        <h2>Расшифровка сокращений</h2>
        <button id="close-legend" class="btn-close">&times;</button>
      </div>
      <div class="legend-content">
        <table id="legend-table" class="legend-table">
          <thead>
            <tr><th>Сокращение</th><th>Полное наименование</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <header class="compact-header">
    <div class="header-left">
      <img src="header-image.png" alt="Logo" class="header-image" onerror="this.style.display='none'" />
      <div class="title-compact">
        <h1>Функциональная матрица</h1>
        <p class="subtitle-compact">Интерактивный просмотр ролей</p>
      </div>
    </div>
    <div class="header-right">
      <div class="controls-compact" id="controls-compact">
        <div class="filter-compact" data-filter-id="filter-block"></div>
        <div class="filter-compact" data-filter-id="filter-function"></div>
        <div class="filter-compact" data-filter-id="filter-department"></div>
        <div class="filter-compact" data-filter-id="filter-position"></div>
        <div class="filter-compact" data-filter-id="filter-role"></div>
      </div>
      <div class="actions-compact">
        <button id="settings-btn" class="btn-light btn-hidden" title="Настройки">⚙️</button>
        <button id="legend-btn" class="btn-light" title="Расшифровка сокращений">📖 Легенда</button>
        <button id="clear" class="btn-light">Сбросить</button>
        <div class="export-dropdown">
          <button id="export-toggle" class="btn-primary">Экспорт ▾</button>
          <div class="export-menu">
            <button id="export-excel">Excel (.xlsx)</button>
            <button id="export-pdf">PDF (печать)</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Строка умного поиска -->
  <div class="search-bar-row">
    <div class="search-bar-wrapper">
      <span class="search-icon">🔍</span>
      <input
        type="text"
        id="smart-search"
        placeholder='Умный поиск по блоку функций и функциям... (пример: "тех над" найдёт "технический надзор")'
        autocomplete="off"
      />
      <button id="clear-search" class="btn-clear-search" title="Очистить поиск" style="display:none">✕</button>
    </div>
    <div id="search-status" class="search-status"></div>
  </div>

  <main class="main-area">
    <div id="info" class="info hidden"></div>
    <div class="table-wrapper" id="table-wrapper">
      <table id="matrix" aria-describedby="info"></table>
    </div>
  </main>

  <div id="floating-tooltip" class="floating-tooltip hidden" role="tooltip"></div>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
