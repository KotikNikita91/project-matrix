<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Функциональная матрица</title>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="compact-header">
    <div class="header-left">
      <img src="header-image.png" alt="Logo" class="header-image" />
      <div class="title-compact">
        <h1>Функциональная матрица</h1>
        <p class="subtitle-compact">Интерактивный просмотр ролей</p>
      </div>
    </div>

    <div class="header-right">
      <div class="controls-compact">
        <div class="filter-compact">
          <label for="filter-function">Функция</label>
          <select id="filter-function" multiple size="4" class="native-multi"></select>
        </div>

        <div class="filter-compact">
          <label for="filter-department">Департамент</label>
          <select id="filter-department" multiple size="4" class="native-multi"></select>
        </div>

        <div class="filter-compact">
          <label for="filter-division">Отдел</label>
          <select id="filter-division" multiple size="4" class="native-multi"></select>
        </div>

        <div class="filter-compact">
          <label for="filter-position">Должность</label>
          <select id="filter-position" multiple size="4" class="native-multi"></select>
        </div>

        <div class="filter-compact">
          <label for="filter-role">Роль</label>
          <select id="filter-role" multiple size="4" class="native-multi"></select>
        </div>
      </div>

      <div class="actions-compact">
        <button id="clear" class="btn-light">Сбросить</button>
        <button id="export" class="btn-primary">Экспорт</button>
      </div>
    </div>
  </header>

  <main class="main-area">
    <div id="info" class="info hidden"></div>

    <div class="table-wrapper" id="table-wrapper">
      <table id="matrix" aria-describedby="info">
        <colgroup>
          <col class="c1" />
          <col class="c2" />
          <col class="c3" />
          <col class="c4" />
          <col class="c5" />
          <col class="c6" />
          <col class="c7" />
        </colgroup>
        <thead>
          <tr>
            <th data-key="num" class="col-id sortable">№ <span class="sort-arrow"></span></th>
            <th data-key="func" class="col-function sortable">Функция <span class="sort-arrow"></span></th>
            <th data-key="product" class="col-text-medium sortable">Продукт <span class="sort-arrow"></span></th>
            <th data-key="department" class="col-department sortable">Департамент <span class="sort-arrow"></span></th>
            <th data-key="division" class="col-division sortable">Отдел <span class="sort-arrow"></span></th>
            <th data-key="position" class="col-position sortable">Должность <span class="sort-arrow"></span></th>
            <th data-key="role" class="col-role sortable">Роль <span class="sort-arrow"></span></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <div id="floating-tooltip" class="floating-tooltip hidden" role="tooltip"></div>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
